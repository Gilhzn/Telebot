# Latency probe: which public channel lists new press releases first (RSS vs newsroom pages).
# Separate from radar.yml so it never blocks the bot's own runs. Trigger: change
# .github/probe-request and push, or Run workflow.
name: probe
on:
  push:
    paths: [".github/probe-request"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python tools/latency_probe.py 200
