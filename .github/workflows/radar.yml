# Stock News Radar on GitHub Actions: one --once pass every 5 minutes.
# Alerts arrive 5+ minutes late here; a server (Railway / Oracle) is faster.
#
# Setup (README → "GitHub Actions"):
#   Settings → Secrets and variables → Actions
#     Secrets:   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, SEC_USER_AGENT (+ optional ANTHROPIC_API_KEY)
#     Variables: RADAR_MODE = actions   (off by default, so it never runs next to a server)
#
# state.json lives on its own branch "state" as a single commit that is replaced on every
# run, so the code branch history stays clean.
#
# Modes: once (regular pass) · test (sample alert) · diag (wire connectivity)
#        demo (score the newest REAL items and send the best one + a summary; no state)
# A push that changes .github/run-request runs the mode written in that file.
name: radar
# The 5-minute schedule lives in radar-schedule.yml, which dispatches this workflow.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "once = regular pass, test = sample alert, diag = feed connectivity, demo = real-news demo"
        type: choice
        options: [once, test, diag, demo]
        default: once
  push:
    paths: [".github/run-request"]
permissions:
  contents: write
concurrency: {group: radar, cancel-in-progress: false}
jobs:
  run:
    if: vars.RADAR_MODE == 'actions'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STATE_FILE: state.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt

      - name: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) MODE="$INPUT_MODE" ;;
            push) MODE=$(awk 'NF {print $1; exit}' .github/run-request) ;;
            *) MODE=once ;;  # schedule (legacy) or anything else
          esac
          case "$MODE" in once|test|diag|demo) ;; *) MODE=once ;; esac
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "mode: $MODE ($GITHUB_EVENT_NAME)"
          # Optional one-off threshold for this run only: second word of .github/run-request, e.g. "once 1".
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            MIN=$(awk 'NF {print $2; exit}' .github/run-request)
            if [[ "$MIN" =~ ^-?[0-5]$ ]]; then
              echo "MIN_SCORE=$MIN" >> "$GITHUB_ENV"
              echo "one-off MIN_SCORE=$MIN for this run"
            fi
          fi

      - name: test
        if: env.MODE == 'test'
        run: python bot.py --test

      - name: diag
        if: env.MODE == 'diag'
        run: |
          # Same identity and protocol (HTTP/1.1) as the bot's httpx client.
          UA=$(python -c "import bot; print(bot.WIRE_USER_AGENT)")
          probe() {  # label, url
            printf '%-22s ' "$1"
            curl -sS --http1.1 -o /tmp/body -m 30 -A "$UA" \
              -H "Accept: application/rss+xml, application/xml;q=0.9, text/html;q=0.8, */*;q=0.7" \
              -H "Accept-Language: en-US,en;q=0.9" \
              -w 'HTTP %{http_code}  %{time_total}s  %{size_download} bytes  %{redirect_url}\n' "$2" || echo "curl failed"
            echo "    $(head -c 100 /tmp/body 2>/dev/null | tr '\n' ' ')"
          }
          GLOBE="https://www.globenewswire.com/RssFeed/orgclass/1/feedTitle/GlobeNewswire%20-%20News%20about%20Public%20Companies"
          PRN="https://www.prnewswire.com/rss/news-releases-list.rss"
          for i in 1 2 3; do
            probe "globenewswire #$i" "$GLOBE"
            probe "prnewswire #$i" "$PRN"
            sleep 2
          done

      - name: demo
        if: env.MODE == 'demo'
        run: python bot.py --demo

      - name: load state
        if: env.MODE == 'once'
        run: |
          if git fetch --depth 1 origin state 2>/dev/null; then
            git show FETCH_HEAD:state.json > state.json && echo "state loaded"
          else
            echo "no state branch yet — first run will only initialise the feeds"
          fi

      - name: run
        if: env.MODE == 'once'
        run: python bot.py --once

      - name: save state
        if: env.MODE == 'once' && hashFiles('state.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/state" && cp state.json "$RUNNER_TEMP/state/"
          cd "$RUNNER_TEMP/state"
          git init -q -b state
          git config user.name radar-bot
          git config user.email radar-bot@users.noreply.github.com
          git add state.json
          git commit -q -m "state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state
