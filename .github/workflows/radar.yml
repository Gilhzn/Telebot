# Stock News Radar on GitHub Actions.
# Each "once" run polls continuously for RADAR_LOOP_MINUTES (default 60): SEC every 2s, the
# main wire feeds every 10s. The external trigger (cron-job.org) keeps one run queued, so the
# next run starts as soon as this one ends. RADAR_LOOP_MINUTES = 0 restores the single-pass
# mode (python bot.py --once).
#
# Setup (README → "GitHub Actions"):
#   Settings → Secrets and variables → Actions
#     Secrets:   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, SEC_USER_AGENT (+ optional ANTHROPIC_API_KEY)
#     Variables: RADAR_MODE = actions   (off by default, so it never runs next to a server)
#
# state.json lives on its own branch "state" as a single commit that is replaced on every
# run, so the code branch history stays clean.
#
# Modes: once (regular pass) · test (sample alert) · diag (wire connectivity)
#        demo (score the newest REAL items and send the best one + a summary; no state)
# A push that changes .github/run-request runs the mode written in that file.
name: radar
# The 5-minute schedule lives in radar-schedule.yml, which dispatches this workflow.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "once = regular pass, test = sample alert, diag = feed connectivity, demo = real-news demo"
        type: choice
        options: [once, test, diag, demo]
        default: once
  push:
    paths: [".github/run-request"]
permissions:
  contents: write
concurrency: {group: radar, cancel-in-progress: false}
jobs:
  run:
    if: vars.RADAR_MODE == 'actions'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STATE_FILE: state.json
      LOOP_MINUTES: ${{ vars.RADAR_LOOP_MINUTES || '60' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt

      - name: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) MODE="$INPUT_MODE" ;;
            push) MODE=$(awk 'NF {print $1; exit}' .github/run-request) ;;
            *) MODE=once ;;  # schedule (legacy) or anything else
          esac
          case "$MODE" in once|test|diag|demo) ;; *) MODE=once ;; esac
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "mode: $MODE ($GITHUB_EVENT_NAME)"
          # Optional one-off threshold for this run only: second word of .github/run-request, e.g. "once 1".
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            MIN=$(awk 'NF {print $2; exit}' .github/run-request)
            if [[ "$MIN" =~ ^-?[0-5]$ ]]; then
              echo "MIN_SCORE=$MIN" >> "$GITHUB_ENV"
              echo "one-off MIN_SCORE=$MIN for this run"
            fi
          fi

      - name: test
        if: env.MODE == 'test'
        run: python bot.py --test

      - name: diag
        if: env.MODE == 'diag'
        run: python tools/probe_feeds.py

      - name: demo
        if: env.MODE == 'demo'
        run: python bot.py --demo

      - name: load state
        if: env.MODE == 'once'
        run: |
          if git fetch --depth 1 origin state 2>/dev/null; then
            git show FETCH_HEAD:state.json > state.json && echo "state loaded"
          else
            echo "no state branch yet — first run will only initialise the feeds"
          fi

      - name: run
        if: env.MODE == 'once'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$LOOP_MINUTES" =~ ^[0-9]+$ ]] || [ "$LOOP_MINUTES" -eq 0 ]; then
            exec python bot.py --once
          fi
          [ "$LOOP_MINUTES" -gt 80 ] && LOOP_MINUTES=80   # stay inside timeout-minutes
          # Push state every 5 minutes, so a lost runner costs at most 5 minutes of state.
          ( while sleep 300; do bash tools/push_state.sh || echo "state sync failed"; done ) &
          sync_pid=$!
          rc=0
          python bot.py --run-for $((LOOP_MINUTES * 60)) || rc=$?
          kill "$sync_pid" 2>/dev/null || true
          exit $rc

      - name: save state
        if: always() && env.MODE == 'once' && hashFiles('state.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/push_state.sh
