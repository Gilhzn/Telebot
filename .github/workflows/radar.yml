# Stock News Radar on GitHub Actions: one --once pass every 5 minutes.
# Alerts arrive 5+ minutes late here; a server (Railway / Oracle) is faster.
#
# Setup (README → "GitHub Actions"):
#   Settings → Secrets and variables → Actions
#     Secrets:   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, SEC_USER_AGENT (+ optional ANTHROPIC_API_KEY)
#     Variables: RADAR_MODE = actions   (off by default, so it never runs next to a server)
#
# state.json lives on its own branch "state" as a single commit that is replaced on every
# run, so the code branch history stays clean.
name: radar
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
    inputs:
      mode:
        description: "once = regular pass, test = send a sample alert, diag = check wire feed connectivity"
        type: choice
        options: [once, test, diag]
        default: once
permissions:
  contents: write
concurrency: {group: radar, cancel-in-progress: false}
jobs:
  run:
    if: vars.RADAR_MODE == 'actions'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STATE_FILE: state.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt

      - name: test
        if: inputs.mode == 'test'
        run: python bot.py --test

      - name: diag
        if: inputs.mode == 'diag'
        run: |
          BROWSER="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          probe() {  # label, url, user-agent
            printf '%-34s ' "$1"
            curl -sS -o /tmp/body -m 30 -A "$3" -H "Accept: application/rss+xml, application/xml;q=0.9, */*;q=0.7" \
              -w 'HTTP %{http_code}  %{time_total}s  %{size_download} bytes  (%{http_version})\n' "$2" || echo "curl failed"
            head -c 120 /tmp/body 2>/dev/null | tr '\n' ' '; echo
          }
          GLOBE="https://www.globenewswire.com/RssFeed/orgclass/1/feedTitle/GlobeNewswire%20-%20News%20about%20Public%20Companies"
          probe "globe rss / browser UA"   "$GLOBE" "$BROWSER"
          probe "globe rss / curl UA"      "$GLOBE" "curl/8.5.0"
          probe "globe rss / reader UA"    "$GLOBE" "Feedly/1.0 (+http://www.feedly.com/fetcher.html)"
          probe "globe atom / browser UA"  "https://www.globenewswire.com/AtomFeed/orgclass/1/feedTitle/GlobeNewswire%20-%20News%20about%20Public%20Companies" "$BROWSER"
          probe "globe home / browser UA"  "https://www.globenewswire.com/" "$BROWSER"
          probe "prnewswire rss / browser" "https://www.prnewswire.com/rss/news-releases-list.rss" "$BROWSER"

      - name: load state
        if: inputs.mode != 'test' && inputs.mode != 'diag'
        run: |
          if git fetch --depth 1 origin state 2>/dev/null; then
            git show FETCH_HEAD:state.json > state.json && echo "state loaded"
          else
            echo "no state branch yet — first run will only initialise the feeds"
          fi

      - name: run
        if: inputs.mode != 'test' && inputs.mode != 'diag'
        run: python bot.py --once

      - name: save state
        if: inputs.mode != 'test' && inputs.mode != 'diag' && hashFiles('state.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/state" && cp state.json "$RUNNER_TEMP/state/"
          cd "$RUNNER_TEMP/state"
          git init -q -b state
          git config user.name radar-bot
          git config user.email radar-bot@users.noreply.github.com
          git add state.json
          git commit -q -m "state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state
