# Backtest of recent alerts with free Yahoo prices (1-minute bars for 29 days, 2-minute for 59).
# Same as backtest.yml, but with its own queue and result branch "backtest-recent", so it never
# waits behind a long run there. Trigger: change .github/backtest-recent-request and push.
name: backtest-recent
on:
  push:
    paths: [".github/backtest-recent-request"]
  workflow_dispatch:
    inputs:
      args:
        description: "mode and arguments, e.g. probe"
        default: probe
permissions:
  contents: write
concurrency: {group: backtest-recent, cancel-in-progress: false}
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      INPUT_ARGS: ${{ inputs.args }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: previous results
        run: |
          for b in backtest backtest-recent; do
            if git fetch --depth 1 origin "$b" 2>/dev/null; then
              git archive FETCH_HEAD backtest-out | tar -x && echo "results restored from $b"
            fi
          done
      - name: run
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then ARGS="$INPUT_ARGS"; else ARGS=$(awk 'NF {print; exit}' .github/backtest-recent-request); fi
          set -- $ARGS
          MODE=$1; shift || true
          echo "mode: $MODE args: $*"
          case "$MODE" in
            probe) python tools/backtest_probe.py ;;
            *) python tools/backtest.py "$MODE" "$@" ;;
          esac
      - name: save results
        if: always() && hashFiles('backtest-out/**') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/bt" && mkdir -p "$dir" && cp -r backtest-out "$dir/"
          cd "$dir"
          git init -q -b backtest-recent
          git config user.name radar-bot
          git config user.email radar-bot@users.noreply.github.com
          git add backtest-out
          git commit -q -m "backtest $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" backtest-recent
