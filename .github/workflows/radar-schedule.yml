# Every 5 minutes, start a regular pass of the radar workflow.
# Kept in its own file so GitHub registers this schedule fresh: the schedule inside
# radar.yml never fired. A run started with the workflow's own GITHUB_TOKEN via
# workflow_dispatch is allowed to create a new run.
name: radar-schedule
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
permissions:
  actions: write
jobs:
  kick:
    if: vars.RADAR_MODE == 'actions'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: start a regular pass
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.repository.default_branch }}
        run: gh workflow run radar.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" -f mode=once
