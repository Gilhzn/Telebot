# Backtest of past alerts (tools/backtest*.py). Separate from radar.yml so it never blocks the bot.
# Trigger: write a mode into .github/backtest-request and push, or Run workflow.
# Results are force-pushed to the "backtest" branch (backtest-out/).
name: backtest
on:
  push:
    paths: [".github/backtest-request"]
  workflow_dispatch:
    inputs:
      args:
        description: "mode and arguments, e.g. probe"
        default: probe
permissions:
  contents: write
concurrency: {group: backtest, cancel-in-progress: false}
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      INPUT_ARGS: ${{ inputs.args }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: previous results
        run: |
          if git fetch --depth 1 origin backtest 2>/dev/null; then
            git archive FETCH_HEAD backtest-out | tar -x && echo "previous results restored"
          fi
      - name: run
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then ARGS="$INPUT_ARGS"; else ARGS=$(awk 'NF {print; exit}' .github/backtest-request); fi
          set -- $ARGS
          MODE=$1; shift || true
          echo "mode: $MODE args: $*"
          case "$MODE" in
            probe) python tools/backtest_probe.py ;;
            catalysts)  # one-year catalyst study over every collected signal; optional START END to collect first
              if git fetch --depth 1 origin backtest-recent 2>/dev/null; then
                git archive FETCH_HEAD backtest-out/pilot | tar -x && echo "pilot signals restored"
              fi
              if [ -n "${1:-}" ]; then python tools/backtest.py collect "$1" "$2" --out backtest-out/main; fi
              python tools/catalysts.py run ;;
            *) python tools/backtest.py "$MODE" "$@" ;;
          esac
      - name: save results
        if: always() && hashFiles('backtest-out/**') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/bt" && mkdir -p "$dir" && cp -r backtest-out "$dir/"
          cd "$dir"
          git init -q -b backtest
          git config user.name radar-bot
          git config user.email radar-bot@users.noreply.github.com
          git add backtest-out
          git commit -q -m "backtest $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" backtest
